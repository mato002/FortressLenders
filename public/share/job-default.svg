<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064E3B"/>
      <stop offset="0.55" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0B3A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="120" r="220" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="980" cy="540" r="260" fill="#FFFFFF" opacity="0.05"/>
  <path d="M0 510 C 220 430, 340 640, 620 560 C 870 490, 980 520, 1200 430 L 1200 630 L 0 630 Z" fill="#FFFFFF" opacity="0.06"/>

  <!-- Card -->
  <g filter="url(#shadow)">
    <rect x="90" y="95" width="1020" height="440" rx="28" fill="#FFFFFF" opacity="0.96"/>
  </g>

  <!-- Brand mark -->
  <g transform="translate(150, 155)">
    <rect x="0" y="0" width="88" height="88" rx="18" fill="#0F766E"/>
    <rect x="0" y="0" width="88" height="88" rx="18" fill="url(#accent)" opacity="0.18"/>
    <text x="44" y="58" text-anchor="middle" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="44" font-weight="800" fill="#FBBF24">F</text>
  </g>

  <!-- Company + tagline -->
  <text x="260" y="205" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="34" font-weight="800" fill="#0F172A">Fortress Lenders</text>
  <text x="260" y="242" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="600" fill="#0F766E">Careers • Job Opportunity</text>

  <!-- Big title placeholder (social platforms use og:title/description; image is just for brand/design) -->
  <text x="150" y="320" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="46" font-weight="800" fill="#0F172A">We’re hiring</text>
  <text x="150" y="370" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="22" font-weight="600" fill="#334155">View details and apply online</text>

  <!-- Footer strip -->
  <rect x="150" y="430" width="900" height="2" fill="#E2E8F0"/>
  <text x="150" y="475" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-size="18" font-weight="600" fill="#0F766E">The Force Of Possibilities</text>
</svg>

